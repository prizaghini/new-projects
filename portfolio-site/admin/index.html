<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Admin login</h1>
    <p class="sub">Manage your portfolio, calendar, campaigns and leads.</p>
    <form id="login-form">
      <div class="field"><label for="email">Email</label><input id="email" type="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required></div>
      <button class="btn" type="submit">Log in</button>
      <p class="msg" id="login-msg"></p>
    </form>
  </div>
</div>
<script type="module" src="../js/config.js"></script>
<script type="module">
import { supabase } from "../js/supabase-client.js";

const { data: { session } } = await supabase.auth.getSession();
if (session) window.location.href = "dashboard.html";

document.getElementById("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("login-msg");
  msg.textContent = "";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    msg.textContent = error.message;
    msg.className = "msg err";
  } else {
    window.location.href = "dashboard.html";
  }
});
</script>
</body>
</html>
